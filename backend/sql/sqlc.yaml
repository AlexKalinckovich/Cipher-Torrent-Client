version: "2"
sql:
  - schema: "user/schema"
    queries:
      - "user/queries/users.sql"
      - "user/queries/user_stats.sql"
    gen:
      go:
        package: "repository"
        out: "../internal/service/user/generated"
    engine: mysql

  - schema:
      - "user/schema"       # <--- Важно: сначала user
      - "torrent/schema"    # <--- Потом torrent
    queries:
      - "torrent/queries/torrents.sql"
      - "torrent/queries/torrent_signatures.sql" # Можно объединить в один блок, если пакет одинаковый
    gen:
      go:
        package: "repository"
        out: "../internal/service/torrent/generated"
    engine: mysql