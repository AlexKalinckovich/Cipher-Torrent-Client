version: "2"
sql:
  - schema: "user/schema"
    queries:
      - "user/queries/users.sql"
      - "user/queries/user_stats.sql"
    gen:
      go:
        package: "repository_errors"
        out: "../internal/service/user/generated"
    engine: mysql
  - schema: "torrent/schema"
    queries: "torrent/queries/torrents.sql"
    gen:
      go:
        package: "repository"
        out: "../internal/service/torrent/generated"
    engine: mysql
  - schema: "torrent/schema"
    queries: "torrent/queries/torrent_signatures.sql"
    gen:
      go:
        package: "repository"
        out: "../internal/service/torrent/generated"
    engine: mysql